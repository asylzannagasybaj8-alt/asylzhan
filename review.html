<!DOCTYPE html>
<html lang="kk">
    <a href="index.html" class="floating-back">Басты бет</a>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.reviews-section {
    max-width: 900px;
    margin: 60px auto;
    padding: 20px;
}

.section-title {
    text-align: center;
    color: white;
    font-size: 32px;
    margin-bottom: 30px;
}

.review-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.review-card:hover {
    transform: translateY(-5px);
}

.review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.review-name {
    font-weight: bold;
    font-size: 18px;
}

.review-rating {
    color: #ffc107;
    font-size: 18px;
}

.review-text {
    margin-top: 10px;
    color: #555;
}
</style>

</head>
<body>

<section class="reviews-section">
    <h2 class="section-title">Пікірлер</h2>

    <div class="review-card">
        <div class="review-header">
            <div class="review-name">Амина</div>
            <div class="review-rating">★★★★★</div>
        </div>
        <div class="review-text">
            Өте керемет қызмет! Маған қатты ұнады.
        </div>
    </div>

    <div class="review-card">
        <div class="review-header">
            <div class="review-name">Ерлан</div>
            <div class="review-rating">★★★★☆</div>
        </div>
        <div class="review-text">
            Жылдам әрі сапалы жасалды.
        </div>
    </div>

    <div class="review-card">
        <div class="review-header">
            <div class="review-name">Данияр</div>
            <div class="review-rating">★★★★★</div>
        </div>
        <div class="review-text">
            Тағы да тапсырыс беремін!
        </div>
    </div>

<div class="review-card">
        <div class="review-header">
            <div class="review-name">Мейыржан</div>
            <div class="review-rating">★★★★★</div>
        </div>
        <div class="review-text">
            акшасына турарлык!
        </div>
    </div>

    <div class="review-card">
        <div class="review-header">
            <div class="review-name">Нурали</div>
            <div class="review-rating">★★★★★</div>
        </div>
        <div class="review-text">
            Жаксы уйрендым жаксы тусындыреды!
        </div>
    </div>
</section>

</body>
</html>
